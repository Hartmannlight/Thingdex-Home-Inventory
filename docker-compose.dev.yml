services:
  db:
    image: postgres:15
    container_name: thingdex-dev-db
    environment:
      POSTGRES_USER: thingdex
      POSTGRES_PASSWORD: thingdex
      POSTGRES_DB: thingdex
    ports:
      - "5432:5432"
    volumes:
      - thingdex_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thingdex -d thingdex"]
      interval: 5s
      timeout: 5s
      retries: 20

  printer-fleet:
    build:
      context: ../../printer-fleet
      dockerfile: Dockerfile
    environment:
      PRINTER_FLEET_DATABASE: /data/fleet.sqlite3
      PRINTER_FLEET_SEED_PATH: /app/config/printers.yml
      PRINTER_FLEET_MDNS_ENABLED: "0"
    volumes:
      - printer_fleet_dev_data:/data
      - ./dev/printhub-printers.yml:/app/config/printers.yml:ro
    depends_on:
      zpl-printer-emulator:
        condition: service_started

  printhub-api:
    build:
      context: ../PrintHub-ZPL-ll
      dockerfile: Dockerfile
    container_name: thingdex-dev-printhub-api
    working_dir: /app
    environment:
      ZPLGRID_TEMPLATES_DIR: /data/templates
      ZPLGRID_PRINT_DRAFTS_DIR: /data/drafts
      ZPLGRID_COUNTERS_PATH: /data/counters.json
      ZPLGRID_ENABLE_LABELARY_API: "1"
      ZPLGRID_ENABLE_LABELARY_PREVIEW: "1"
      ZPLGRID_ENABLE_LABELARY_TEMPLATES: "1"
      ZPLGRID_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175"
      WATCHFILES_FORCE_POLLING: "true"
      PRINTHUB_FLEET_API_URL: http://printer-fleet:8000
    depends_on:
      printer-fleet:
        condition: service_started
    ports:
      - "8001:8000"
    volumes:
      - ../PrintHub-ZPL-ll:/app
      - ./dev/printhub-printers.yml:/app/configs/printers.yml:ro
      - printhub_dev_data:/data
    command: uvicorn zplgrid.api:app --host 0.0.0.0 --port 8000 --reload

  zpl-printer-emulator:
    build:
      context: ../ZPL-II-Printer-Emulator
      dockerfile: Dockerfile
    container_name: thingdex-dev-zpl-printer-emulator
    environment:
      ZPL_EMULATOR_HOST: 0.0.0.0
      ZPL_EMULATOR_WEB_PORT: "9191"
      ZPL_EMULATOR_TCP_HOST: 0.0.0.0
      ZPL_EMULATOR_TCP_PORT: "9100"
      ZPL_EMULATOR_LABEL_WIDTH_IN: "1.9685"
      ZPL_EMULATOR_LABEL_HEIGHT_IN: "0.9843"
      ZPL_EMULATOR_DPMM: "8"
    ports:
      - "9191:9191"
      - "9102:9100"

  thingdex-api:
    build:
      context: ../Thingdex
      dockerfile: Dockerfile
    container_name: thingdex-dev-api
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://thingdex:thingdex@db:5432/thingdex
      ROOT_LOCATION_NAME: World
      LABEL_PRINTING_ENABLED: "true"
      LABEL_API_BASE: http://printhub-api:8000/v1
      PRINTHUB_API_BASE: http://printhub-api:8000
      LABEL_CONTAINER_TEMPLATE_ID: container-name
      THINGDEX_PRINT_ADMIN_TOKEN: dev-print-admin-token
      THINGDEX_PRINTHUB_EVENT_SECRET: dev-event-secret
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../Thingdex:/app
    command: sh -c "alembic upgrade head && uvicorn thingdex.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  thingdex-print-worker:
    build:
      context: ../Thingdex
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://thingdex:thingdex@db:5432/thingdex
      PRINTHUB_API_BASE: http://printhub-api:8000
      THINGDEX_PRINT_WORKER_INTERVAL_SECONDS: "1"
      THINGDEX_PRINT_MAX_ATTEMPTS: "10"
      THINGDEX_RUN_MIGRATIONS: "false"
    depends_on:
      thingdex-api:
        condition: service_healthy
      printhub-api:
        condition: service_started
    volumes:
      - ../Thingdex:/app
    command: python -m thingdex.print_worker

  thingdex-sdk:
    image: node:22-alpine
    container_name: thingdex-dev-thingdex-sdk
    working_dir: /workspace/thingdex-sdk
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../thingdex-sdk:/workspace/thingdex-sdk
      - thingdex_sdk_node_modules:/workspace/thingdex-sdk/node_modules
    command: sh -c "npm install --package-lock=false && npm run generate && npx tsc -p tsconfig.json --watch --preserveWatchOutput"

  printhub-sdk:
    image: node:22-alpine
    container_name: thingdex-dev-printhub-sdk
    working_dir: /workspace/printhub-sdk
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../printhub-sdk:/workspace/printhub-sdk
      - printhub_sdk_node_modules:/workspace/printhub-sdk/node_modules
    command: sh -c "npm install --package-lock=false && npm run generate && npx tsc -p tsconfig.json --watch --preserveWatchOutput"

  thingdex-ui:
    image: node:22-alpine
    container_name: thingdex-dev-ui
    working_dir: /workspace/ThingdexUI
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: /api
      VITE_API_UPSTREAM: http://thingdex-api:8000
      VITE_LABEL_SERVICE_BASE_URL: /ext/label
      VITE_LABEL_SERVICE_UPSTREAM: http://printhub-api:8000/v1
      VITE_PRINTER_HUB_BASE_URL: /ext/printhub
      VITE_PRINTER_HUB_UPSTREAM: http://printhub-api:8000/v1
      VITE_FEATURE_LABEL_PRINTING: "true"
      VITE_DEFAULT_PRINTER_ID: virtual-zpl-dev
    depends_on:
      thingdex-api:
        condition: service_started
      thingdex-sdk:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - ../ThingdexUI:/workspace/ThingdexUI
      - ../thingdex-sdk:/workspace/thingdex-sdk
      - thingdex_sdk_node_modules:/workspace/thingdex-sdk/node_modules
      - thingdex_ui_node_modules:/workspace/ThingdexUI/node_modules
    command: >
      sh -c "npm install --package-lock=false &&
      mkdir -p node_modules/@thingdex &&
      rm -rf node_modules/@thingdex/sdk &&
      ln -s /workspace/thingdex-sdk node_modules/@thingdex/sdk &&
      until [ -f /workspace/thingdex-sdk/dist/index.js ]; do echo 'waiting for Thingdex SDK build'; sleep 2; done &&
      npm run dev -- --host 0.0.0.0 --port 5173"

  printhub-studio:
    image: node:22-alpine
    container_name: thingdex-dev-printhub-studio
    working_dir: /workspace/LabelArchitect
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_BACKEND_API_BASE: http://localhost:8001
      VITE_RENDER_API_BASE: http://localhost:8001
      VITE_DEV_API_PROXY: http://printhub-api:8000
    depends_on:
      printhub-api:
        condition: service_started
      printhub-sdk:
        condition: service_started
    ports:
      - "5174:5174"
    volumes:
      - ../LabelArchitect:/workspace/LabelArchitect
      - ../printhub-sdk:/workspace/printhub-sdk
      - printhub_sdk_node_modules:/workspace/printhub-sdk/node_modules
      - labelarchitect_node_modules:/workspace/LabelArchitect/node_modules
    command: >
      sh -c "npm install --package-lock=false &&
      mkdir -p node_modules/@printhub &&
      rm -rf node_modules/@printhub/sdk &&
      ln -s /workspace/printhub-sdk node_modules/@printhub/sdk &&
      until [ -f /workspace/printhub-sdk/dist/index.js ]; do echo 'waiting for PrintHub SDK build'; sleep 2; done &&
      npm run dev -- --host 0.0.0.0 --port 5174"

volumes:
  thingdex_dev_pgdata:
  printer_fleet_dev_data:
  printhub_dev_data:
  thingdex_sdk_node_modules:
  printhub_sdk_node_modules:
  thingdex_ui_node_modules:
  labelarchitect_node_modules:
